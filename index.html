<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>://www.com</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Intro Animation Stage -->
  <div id="intro-stage">
    <div id="trophy-wrapper">
      <div id="trophy">🏆</div>
      <div id="smack-w">W</div>
    </div>
    <div id="ground">
      <div id="cracks"></div>
    </div>
  </div>

  <header>
    <h1>://www.com</h1>
    <p>Welcome to the home of W.</p>
  </header>

  <main>
    <!-- Embedded Game Player (Hidden until a game is clicked) -->
    <section id="player-container" class="hidden">
      <div id="player-header">
        <h2 id="current-game-title">Playing Game</h2>
        <div id="player-controls">
          <a id="open-new-tab" href="#" target="_blank" rel="noopener noreferrer">Open in New Tab ↗</a>
          <button id="close-player">Close Game ✕</button>
        </div>
      </div>
      <iframe id="game-iframe" src="" allowfullscreen></iframe>
    </section>

    <!-- Customizable JSON Game Links Section -->
    <section id="games-section">
      <h2>Games</h2>
      <div id="games-list">
        <!-- Cards from games.json will appear here automatically -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
