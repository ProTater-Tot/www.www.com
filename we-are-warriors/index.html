<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Are Warriors - Stone Age</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-wrapper">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="badge era-badge">Age 1: Stone Age</div>
      <div class="badge coin-badge">🪙 <span id="coinDisplay">0</span></div>
    </div>

    <!-- Main Battlefield -->
    <div class="canvas-container">
      <canvas id="gameCanvas" width="850" height="380"></canvas>

      <!-- Out-of-Match Upgrade Menu Overlay -->
      <div id="menuOverlay" class="overlay">
        <h1 id="menuTitle">WE ARE WARRIORS</h1>
        <p id="menuSubtitle">Defeat enemies to earn coins and upgrade your tribe!</p>

        <div class="upgrade-grid">
          <div class="upgrade-card">
            <h3>🍖 Food Production</h3>
            <p>Level <span id="foodLvlDisplay">1</span> (<span id="foodRateDisplay">1.2</span>/s)</p>
            <button id="btnUpgradeFood" onclick="buyUpgrade('food')">Upgrade (🪙 15)</button>
          </div>

          <div class="upgrade-card">
            <h3>🏰 Base Health</h3>
            <p>Level <span id="baseLvlDisplay">1</span> (<span id="baseHpDisplay">200</span> HP)</p>
            <button id="btnUpgradeBase" onclick="buyUpgrade('base')">Upgrade (🪙 15)</button>
          </div>

          <div class="upgrade-card">
            <h3>🏹 Unlock Slinger</h3>
            <p id="slingerStatus">Ranged Unit (Cost: 18 Food)</p>
            <button id="btnUnlockSlinger" onclick="buyUpgrade('slinger')">Unlock (🪙 30)</button>
          </div>

          <div class="upgrade-card">
            <h3>🦖 Unlock Dino Rider</h3>
            <p id="dinoStatus">Heavy Tank (Cost: 40 Food)</p>
            <button id="btnUnlockDino" onclick="buyUpgrade('dino')">Unlock (🪙 75)</button>
          </div>
        </div>

        <button class="battle-btn" onclick="startBattle()">⚔️ START BATTLE</button>
      </div>
    </div>

    <!-- In-Game Bottom Spawn Controls -->
    <div id="battleControls" class="bottom-bar hidden">
      <div class="food-box">
        <div class="food-label">🍖 FOOD: <span id="foodDisplay">0</span></div>
        <div class="food-bar-bg">
          <div id="foodProgress" class="food-bar-fill"></div>
        </div>
      </div>

      <div class="unit-buttons">
        <button id="btnSpawnClubman" class="unit-btn" onclick="spawnUnit('clubman')">
          <span class="unit-name">Clubman</span>
          <span class="unit-cost">🍖 8</span>
        </button>

        <button id="btnSpawnSlinger" class="unit-btn hidden" onclick="spawnUnit('slinger')">
          <span class="unit-name">Slinger</span>
          <span class="unit-cost">🍖 18</span>
        </button>

        <button id="btnSpawnDino" class="unit-btn hidden" onclick="spawnUnit('dino')">
          <span class="unit-name">Dino Rider</span>
          <span class="unit-cost">🍖 40</span>
        </button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
