<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>We Are Warriors - Web Clone</title>
  <style>
    body {
      margin: 0;
      background-color: #1e1e2e;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background-color: #87ceeb;
      border: 4px solid #313244;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .ui-bar {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      background: #313244;
      padding: 12px 20px;
      border-radius: 8px;
      align-items: center;
    }
    .stats {
      margin-right: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }
    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background-color: #f9e2af;
      color: #11111b;
      transition: transform 0.1s, background-color 0.2s;
    }
    button:hover:not(:disabled) {
      background-color: #fab387;
      transform: translateY(-2px);
    }
    button:disabled {
      background-color: #585b70;
      color: #a6adc8;
      cursor: not-allowed;
    }
    .upgrade-btn {
      background-color: #a6e3a1;
    }
    .upgrade-btn:hover:not(:disabled) {
      background-color: #94e2d5;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="800" height="350"></canvas>

  <div class="ui-bar">
    <div class="stats">
      <div>Age: <span id="ageDisplay">Stone Age</span></div>
      <div>Food: <span id="foodDisplay">0</span></div>
    </div>

    <button id="spawnBasic" onclick="spawnUnit('basic')">Clubman (10 Food)</button>
    <button id="spawnRanged" onclick="spawnUnit('ranged')">Slinger (25 Food)</button>
    <button id="spawnTank" onclick="spawnUnit('tank')">Dino Rider (50 Food)</button>
    <button id="upgradeFood" class="upgrade-btn" onclick="upgradeFoodRate()">Upgrade Food (30 Food)</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
