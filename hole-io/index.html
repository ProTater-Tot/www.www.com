<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hole.io | ://www.com</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    #top-bar { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; border-bottom: 2px solid #333; padding: 10px 20px; height: 56px; }
    .nav-btn { background: #222; color: #ffd700; border: 2px solid #333; padding: 6px 14px; border-radius: 8px; text-decoration: none; font-weight: bold; cursor: pointer; }
    #hud-stats { display: flex; gap: 24px; font-size: 1.1rem; font-weight: bold; }
    #hud-stats span { color: #ffd700; }
    #game-wrapper { position: relative; flex-grow: 1; width: 100%; overflow: hidden; background: #2b303a; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    #overlay { position: absolute; inset: 0; background: rgba(17,17,17,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem; z-index: 20; }
    #overlay.hidden { display: none; }
    #overlay h2 { font-size: 3rem; color: #ffd700; }
    #play-btn { background: #ffd700; color: #111; border: none; padding: 14px 36px; font-size: 1.3rem; font-weight: 900; border-radius: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <header id="top-bar">
    <a class="nav-btn" href="../">← Back to Hub</a>
    <div id="hud-stats">
      <div>Score: <span id="score-display">0</span></div>
      <div>Size: <span id="size-display">1.0</span>m</div>
      <div>Time: <span id="time-display">60</span>s</div>
    </div>
    <button class="nav-btn" id="fullscreen-btn">⛶ Fullscreen</button>
  </header>
  <div id="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">HOLE.IO</h2>
      <p id="overlay-subtitle">Move your mouse or drag to swallow the city!</p>
      <button id="play-btn">PLAY</button>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
